<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The GTM Workshop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background-color: #ffffff;
    background-image:
      radial-gradient(
        circle 1.75px at 10.5px 10.5px,
        transparent 1.25px,
        rgba(0,0,0,0.06) 1.25px,
        rgba(0,0,0,0.06) 1.75px,
        transparent 1.75px
      ),
      radial-gradient(
        circle 1.6px at 9.75px 9.75px,
        transparent 1.1px,
        rgba(255,255,255,0.9) 1.1px,
        rgba(255,255,255,0.9) 1.6px,
        transparent 1.6px
      ),
      radial-gradient(
        circle 1.5px at 10px 10px,
        #1a1a1a 1px,
        #2a2a2a 1.25px,
        #3a3a3a 1.5px,
        transparent 1.5px
      ),
      radial-gradient(
        circle 0.25px at 3.5px 6.5px,
        rgba(0,0,0,0.03) 0.25px,
        transparent 0.25px
      ),
      radial-gradient(
        circle 0.25px at 13.5px 1.5px,
        rgba(0,0,0,0.02) 0.25px,
        transparent 0.25px
      ),
      radial-gradient(
        circle 0.2px at 16.5px 14.5px,
        rgba(0,0,0,0.025) 0.2px,
        transparent 0.2px
      );
    background-size:
      20px 20px,
      20px 20px,
      20px 20px,
      20px 20px,
      20px 20px,
      20px 20px;
    background-position: 0 0;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.08);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    z-index: 1;
  }
  #menubar {
    position: fixed;
    top: 20px;
    left: 0;
    width: 100%;
    height: 90px;
    background: #fff;
    z-index: 3;
    border-top: 1px solid #1a1a1a;
    border-bottom: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    padding: 0 16px 0 20px;
  }
  #logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
    cursor: pointer;
    transition: filter 0.2s ease;
  }
  #logo-link:hover #logo path {
    fill: #444;
  }
  #logo-link:hover #title {
    color: #444;
  }
  #logo-link:hover #wrench path {
    fill: #444;
  }
  #logo {
    height: 62px;
    flex-shrink: 0;
  }
  #logo path {
    transition: fill 0.2s ease;
  }
  #wrench {
    height: 24px;
    width: 24px;
    flex-shrink: 0;
    margin-left: 10px;
  }
  #title {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: 8px;
    height: 72px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    color: #1a1a1a;
    transition: color 0.2s ease;
    line-height: 0.9;
    letter-spacing: 0.05em;
  }
  #title span:first-child {
    font-size: 26px;
  }
  #title span:last-child {
    font-size: 46px;
  }
  #menu {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 28px;
    padding-right: 8px;
  }
  #menu a {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 28px;
    text-transform: uppercase;
    text-decoration: none;
    color: #1a1a1a;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border: 1px solid transparent;
    transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  }
  #menu a:hover,
  #menu a.active {
    color: #fff;
    background-color: #1a1a1a;
    border-color: #1a1a1a;
  }
  #trail-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  /* Pages */
  .page {
    display: none;
    position: relative;
    z-index: 2;
    padding-top: 140px;
    padding-bottom: 60px;
  }
  .page.active {
    display: block;
  }

  /* Home */
  #page-home {
    min-height: 100vh;
  }

  /* Artifacts */
  #slides {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .slide {
    width: 60vw;
    aspect-ratio: 16 / 9;
    background: #fff;
    border: 1px solid #1a1a1a;
    flex-shrink: 0;
    position: relative;
    container-type: inline-size;
    overflow: hidden;
    padding: 3cqw;
    font-size: 2cqw;
  }
  .slide-number {
    position: absolute;
    bottom: 1.5cqw;
    right: 2cqw;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 2.5cqw;
    color: #1a1a1a;
  }
</style>
</head>

  <canvas id="trail-canvas"></canvas>
  <script>
    // Router
    function navigate() {
      var hash = location.hash.replace('#', '') || 'home';
      var pages = document.querySelectorAll('.page');
      pages.forEach(function(p) { p.classList.remove('active'); });
      var target = document.getElementById('page-' + hash);
      if (target) {
        target.classList.add('active');
      } else {
        document.getElementById('page-home').classList.add('active');
      }

      // Update active menu item
      var links = document.querySelectorAll('#menu a');
      links.forEach(function(a) {
        var linkHash = a.getAttribute('href').replace('#', '');
        if (linkHash === hash) {
          a.classList.add('active');
        } else {
          a.classList.remove('active');
        }
      });

      window.scrollTo(0, 0);
    }

    window.addEventListener('hashchange', navigate);
    navigate();

    // Trail canvas
    const canvas = document.getElementById('trail-canvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const CENTER = 10;
    const SNAP_RADIUS = 8;
    const FADE_TIME = 1000;

    const segments = [];
    const dots = [];
    let lastHole = null;
    let overSlide = false;

    document.querySelectorAll('.slide').forEach(function(el) {
      el.addEventListener('mouseenter', function() { overSlide = true; lastHole = null; });
      el.addEventListener('mouseleave', function() { overSlide = false; });
    });

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    document.addEventListener('mousemove', (e) => {
      if (overSlide) return;
      const nearestX = Math.round((e.clientX - CENTER) / GRID) * GRID + CENTER;
      const nearestY = Math.round((e.clientY - CENTER) / GRID) * GRID + CENTER;

      const dx = e.clientX - nearestX;
      const dy = e.clientY - nearestY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < SNAP_RADIUS) {
        const key = nearestX + ',' + nearestY;
        if (!lastHole || lastHole.key !== key) {
          const now = Date.now();
          dots.push({ x: nearestX, y: nearestY, time: now });
          if (lastHole) {
            if (lastHole.x === nearestX || lastHole.y === nearestY) {
              segments.push({
                x1: lastHole.x, y1: lastHole.y,
                x2: nearestX, y2: nearestY,
                time: now
              });
            }
          }
          lastHole = { x: nearestX, y: nearestY, key };
        }
      }
    });

    document.addEventListener('mouseleave', () => {
      lastHole = null;
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();

      for (let i = segments.length - 1; i >= 0; i--) {
        const s = segments[i];
        const age = now - s.time;
        if (age > FADE_TIME) { segments.splice(i, 1); continue; }
        const alpha = 1 - age / FADE_TIME;
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.strokeStyle = 'rgba(180,180,180,' + alpha + ')';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      for (let i = dots.length - 1; i >= 0; i--) {
        const d = dots[i];
        const age = now - d.time;
        if (age > FADE_TIME) { dots.splice(i, 1); continue; }
        const alpha = 1 - age / FADE_TIME;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180,180,180,' + alpha + ')';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
